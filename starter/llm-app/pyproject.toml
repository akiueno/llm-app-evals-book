[project]
name = "llm-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = "==3.13.*"
dependencies = [
    "fastapi[standard]==0.139.0",
    "langchain==1.3.13",
    "langchain-anthropic==1.4.8",
    "langchain-core==1.4.9",
    "langgraph==1.2.9",
    "langsmith==0.10.2",
    "openevals==0.2.0",
    "python-dotenv==1.2.2",
    "pyyaml==6.0.3",
    "uvicorn[standard]==0.51.0",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "langsmith-fetch==0.3.1",
    "mypy==2.2.0",
    "ruff==0.15.21",
    "types-pyyaml==6.0.12.20260518",
]

[tool.uv]
# サプライチェーン攻撃対策: 公開から2週間未満のバージョンを解決対象から除外する。
# 相対指定のためuv.lockにはスパン(P2W)が記録され、基準時刻は解決実行時に
# 「その時点の2週間前」として毎回計算される。ロックが最新なら再解決は走らないので、
# 依存変更やuv lock --upgradeなどで再解決したときにカットオフが更新される。
exclude-newer = "2 weeks"
# exclude-newerの挙動が安定しているバージョンを要求する
required-version = ">=0.11"

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstring rules
    "ANN",     # type annotation enforcement
    "TRY",     # tryceratops
    "EM",      # error message style
    "FA",      # future-annotations
    "SIM108",  # ternary operator
    "S101",    # assert usage
    "RET505",  # else-return
    "COM812",  # trailing comma (conflicts with formatter)
    "TC001",   # type-checking import (first-party)
    "TC002",   # type-checking import (third-party)
    "RUF001",  # ambiguous unicode (fullwidth Japanese chars)
    "E501",    # line too long (Japanese text; formatter handles code)
    "T201",    # print (used in eval CLI scripts)
    "PTH123",  # Path.open() preference
    "RET504",  # unnecessary assignment before return
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
